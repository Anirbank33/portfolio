<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Solar Cell Grid Pattern Gradient -->
    <linearGradient id="solarCellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Gold Thermal MLI Foil -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Metallic Bus Chassis -->
    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Signal Wave Gradient -->
    <radialGradient id="signalWave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <filter id="satGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes satDrift {
      0%, 100% { transform: translateY(0px) rotate(12deg); }
      50% { transform: translateY(-10px) rotate(15deg); }
    }
    @keyframes signalPulse {
      0% { r: 6px; opacity: 0.9; }
      100% { r: 32px; opacity: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .satellite-group {
      animation: satDrift 7s ease-in-out infinite;
      transform-origin: 120px 80px;
    }
    .pulse-ring {
      animation: signalPulse 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      transform-origin: 120px 42px;
    }
    .beacon-led {
      animation: beaconBlink 1.2s ease-in-out infinite;
    }
  </style>

  <g class="satellite-group">
    <!-- Emitted Signal Waves from Dish Antenna -->
    <circle class="pulse-ring" cx="120" cy="42" r="6" fill="url(#signalWave)" opacity="0.8"/>
    <circle class="pulse-ring" cx="120" cy="42" r="6" fill="url(#signalWave)" opacity="0.8" style="animation-delay: 1.1s;"/>

    <!-- Parabolic Dish Antenna -->
    <path d="M 98 46 Q 120 28 142 46" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="120" y1="36" x2="120" y2="24" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="120" cy="24" r="3.5" fill="#38bdf8" filter="url(#satGlow)"/>
    <line x1="120" y1="46" x2="120" y2="60" stroke="#64748b" stroke-width="3"/>

    <!-- Left Solar Array Wing & Joint Truss -->
    <line x1="50" y1="80" x2="96" y2="80" stroke="#94a3b8" stroke-width="4"/>
    <g transform="translate(8, 54)">
      <!-- Left Solar Panel Body -->
      <rect x="0" y="0" width="76" height="52" rx="4" fill="url(#solarCellGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Grid Lines -->
      <line x1="25" y1="0" x2="25" y2="52" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="50" y1="0" x2="50" y2="52" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="17" x2="76" y2="17" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="35" x2="76" y2="35" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Right Solar Array Wing & Joint Truss -->
    <line x1="144" y1="80" x2="190" y2="80" stroke="#94a3b8" stroke-width="4"/>
    <g transform="translate(156, 54)">
      <!-- Right Solar Panel Body -->
      <rect x="0" y="0" width="76" height="52" rx="4" fill="url(#solarCellGrad)" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Grid Lines -->
      <line x1="25" y1="0" x2="25" y2="52" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="50" y1="0" x2="50" y2="52" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="17" x2="76" y2="17" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="35" x2="76" y2="35" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Main Satellite Body Chassis (Cuboid) -->
    <rect x="96" y="60" width="48" height="48" rx="8" fill="url(#goldFoil)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="102" y="66" width="36" height="36" rx="4" fill="url(#metalChassis)" opacity="0.4"/>

    <!-- Sensor Lenses / Optics -->
    <circle cx="120" cy="84" r="8" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="120" cy="84" r="4" fill="#00f0ff" filter="url(#satGlow)"/>
    <circle cx="122" cy="82" r="1.5" fill="#ffffff"/>

    <!-- Navigational Beacon LEDs -->
    <circle class="beacon-led" cx="98" cy="62" r="3" fill="#f43f5e" filter="url(#satGlow)"/>
    <circle class="beacon-led" cx="142" cy="62" r="3" fill="#34d399" filter="url(#satGlow)" style="animation-delay: -0.6s;"/>
    <circle class="beacon-led" cx="120" cy="106" r="3" fill="#38bdf8" filter="url(#satGlow)" style="animation-delay: -0.3s;"/>
  </g>
</svg>
