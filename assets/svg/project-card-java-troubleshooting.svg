<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="javCmpBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Liquid Glass Edge Bevel -->
    <linearGradient id="javCmpBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#71717a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="javCmpSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="javCmpShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;220%" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;320%" dur="7.4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="javCmpOrb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="javCmpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Liquid Mercury / Pure White Glass Slider -->
    <linearGradient id="javLiqSlider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>

  <!-- Ambient Liquid Caustics -->
  <circle cx="45" cy="50" r="40" fill="#ffffff" opacity="0.22" filter="url(#javCmpOrb)">
    <animate attributeName="cx" values="45;70;45" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="190" r="45" fill="#ffffff" opacity="0.18" filter="url(#javCmpOrb)">
    <animate attributeName="cy" values="190;160;190" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Glass Panel -->
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#javCmpBgDark)" stroke="url(#javCmpBorderDark)" stroke-width="1.4"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#javCmpSheen)"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#javCmpShimmer)"/>
  <line x1="14" y1="2" x2="156" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9" filter="url(#javCmpGlow)"/>

  <!-- Category Tag -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="150" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.8"/>
    <path d="M7,5 h5 v4 c0,1.5 -1.5,3 -2.5,3 c-1,0 -2.5,-1.5 -2.5,-3 z M12,6 h2 c0.8,0 0.8,1.5 0,1.5 h-2 z M6,13 h7" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <text x="18" y="12.5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.5">
      JVM CONCURRENCY
    </text>
  </g>

  <!-- Title -->
  <text x="10" y="48" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.2">
    java-trouble
  </text>
  <text x="10" y="62" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
    Multi-Threading Labs
  </text>

  <!-- Tagline -->
  <text x="10" y="78" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500">
    JVM memory &amp; deadlock debug
  </text>

  <!-- ANIMATED MULTI-THREAD CONCURRENCY HUD -->
  <g transform="translate(10, 88)">
    <rect x="0" y="0" width="150" height="78" rx="8" fill="#000000" fill-opacity="0.9" stroke="#3f3f46" stroke-width="0.8"/>

    <line x1="0" y1="18" x2="150" y2="18" stroke="#27272a" stroke-width="0.8"/>
    <text x="10" y="12" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      THREAD MONITOR
    </text>
    <text x="142" y="12" text-anchor="end" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      HEAP 42%
    </text>

    <!-- Lane 1: Thread-0 [RUNNABLE] -->
    <g transform="translate(8, 28)">
      <text x="0" y="5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">T0 [RUN]</text>
      <line x1="42" y1="3" x2="134" y2="3" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="44" y="0.5" width="22" height="5" rx="1.5" fill="url(#javLiqSlider)" filter="url(#javCmpGlow)">
        <animate attributeName="x" values="44;110;44" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Lane 2: Thread-1 [SYNC] -->
    <g transform="translate(8, 42)">
      <text x="0" y="5" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">T1 [LOCK]</text>
      <line x1="42" y1="3" x2="134" y2="3" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="85" y="0.5" width="18" height="5" rx="1.5" fill="url(#javLiqSlider)">
        <animate attributeName="x" values="85;50;85" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Lane 3: Thread-2 [POOL] -->
    <g transform="translate(8, 56)">
      <text x="0" y="5" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">T2 [POOL]</text>
      <line x1="42" y1="3" x2="134" y2="3" stroke="#27272a" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="65" y="0.5" width="26" height="5" rx="1.5" fill="url(#javLiqSlider)">
        <animate attributeName="x" values="65;108;65" dur="1.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <line x1="8" y1="67" x2="142" y2="67" stroke="#27272a" stroke-width="0.8"/>
    <text x="75" y="74" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600">
      JVM 17+ • DEADLOCK-FREE
    </text>
  </g>

  <!-- TECH BADGES (Frosted Glass) -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="56" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="28" y="12.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Java 17+</text>

    <rect x="62" y="0" width="88" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="106" y="12.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Spring Boot</text>

    <rect x="0" y="24" width="76" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="38" y="36.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Concurrency</text>

    <rect x="82" y="24" width="68" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="116" y="36.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Multi-Thread</text>
  </g>

  <!-- Bottom CTA Pill -->
  <g transform="translate(10, 248)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.2"/>
    <text x="75" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.4">
      ⚡ DEBUG PATTERNS ↗
    </text>
  </g>
</svg>