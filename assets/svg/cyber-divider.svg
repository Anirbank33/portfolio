<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 26" width="100%" height="26" preserveAspectRatio="none">
  <defs>
    <!-- Vibrant 3D Rainbow Neon Track -->
    <linearGradient id="spectrumTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Laser Pulses -->
    <radialGradient id="pulseCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulsePink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <filter id="rgbGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Spectrum Line -->
  <line x1="20" y1="13" x2="880" y2="13" stroke="url(#spectrumTrack)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Center 3D Crystal Gem -->
  <g filter="url(#rgbGlow)">
    <polygon points="450,6 456,13 450,20 444,13" fill="#ec4899">
      <animate attributeName="fill" values="#00f0ff;#a855f7;#ec4899;#f97316;#10b981;#00f0ff" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="450,8 454,13 450,18 446,13" fill="#ffffff" opacity="0.9"/>
  </g>

</svg>
