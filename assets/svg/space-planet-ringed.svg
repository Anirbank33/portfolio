<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Planet Surface Atmospheric Gradient -->
    <linearGradient id="planetBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Planet Shadow / Dark Side -->
    <radialGradient id="planetShadow" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#050814" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1"/>
    </radialGradient>

    <!-- Planetary Rings Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Atmosphere Glow Filter -->
    <filter id="planetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for Back Half of Rings behind Planet -->
    <clipPath id="backRingsClip">
      <rect x="0" y="0" width="280" height="98"/>
    </clipPath>

    <!-- Clip for Front Half of Rings in front of Planet -->
    <clipPath id="frontRingsClip">
      <rect x="0" y="98" width="280" height="102"/>
    </clipPath>
  </defs>

  <style>
    @keyframes planetFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(-3deg); }
    }
    @keyframes ringShimmer {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(56,189,248,0.5)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(168,85,247,0.75)); }
    }
    @keyframes moonOrbit {
      0% { transform: rotate(0deg) translateX(95px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(95px) rotate(-360deg); }
    }
    .planet-system {
      animation: planetFloat 8s ease-in-out infinite;
      transform-origin: 140px 100px;
    }
    .rings-shimmer {
      animation: ringShimmer 4s ease-in-out infinite;
    }
    .orbiting-moon-wrap {
      transform-origin: 140px 100px;
      animation: moonOrbit 12s linear infinite;
    }
  </style>

  <g class="planet-system">
    <!-- Back Half of Planetary Rings (behind the planet sphere) -->
    <g clip-path="url(#backRingsClip)" class="rings-shimmer">
      <ellipse cx="140" cy="100" rx="120" ry="38" transform="rotate(-18 140 100)" stroke="url(#ringGrad)" stroke-width="12" fill="none" opacity="0.65"/>
      <ellipse cx="140" cy="100" rx="132" ry="42" transform="rotate(-18 140 100)" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8"/>
      <ellipse cx="140" cy="100" rx="104" ry="32" transform="rotate(-18 140 100)" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.7"/>
    </g>

    <!-- Outer Atmospheric Haze -->
    <circle cx="140" cy="100" r="54" fill="#a855f7" opacity="0.35" filter="url(#planetGlow)"/>

    <!-- Main Planet Sphere -->
    <circle cx="140" cy="100" r="50" fill="url(#planetBody)"/>

    <!-- Atmosphere Bands & Storm Belts -->
    <g opacity="0.45">
      <path d="M 94 88 Q 140 98 186 88" stroke="#ffffff" stroke-width="3" fill="none"/>
      <path d="M 91 100 Q 140 110 189 100" stroke="#38bdf8" stroke-width="5" fill="none"/>
      <path d="M 93 112 Q 140 122 187 112" stroke="#f43f5e" stroke-width="4" fill="none"/>
      <path d="M 98 124 Q 140 132 182 124" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Atmospheric Eclipse / Night Side Radial Shading -->
    <circle cx="140" cy="100" r="50" fill="url(#planetShadow)"/>

    <!-- Front Half of Planetary Rings (cuts across front of planet) -->
    <g clip-path="url(#frontRingsClip)" class="rings-shimmer">
      <ellipse cx="140" cy="100" rx="120" ry="38" transform="rotate(-18 140 100)" stroke="url(#ringGrad)" stroke-width="12" fill="none" opacity="0.9"/>
      <ellipse cx="140" cy="100" rx="132" ry="42" transform="rotate(-18 140 100)" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.95"/>
      <ellipse cx="140" cy="100" rx="104" ry="32" transform="rotate(-18 140 100)" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.85"/>
      <!-- Ring Gap (Cassini Division accent) -->
      <ellipse cx="140" cy="100" rx="114" ry="36" transform="rotate(-18 140 100)" stroke="#060911" stroke-width="2" fill="none" opacity="0.75"/>
    </g>

    <!-- Orbiting Natural Moonlet -->
    <g class="orbiting-moon-wrap">
      <circle cx="140" cy="100" r="6" fill="#e2e8f0" stroke="#38bdf8" stroke-width="1.2" filter="url(#planetGlow)"/>
      <circle cx="140" cy="100" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
