<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
  <defs>
    <!-- 3D Platform Gradients -->
    <linearGradient id="platTop4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="platLeft4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="platRight4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#260e02"/>
    </linearGradient>

    <!-- 3D Terminal Monitor Gradients -->
    <linearGradient id="monTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="monLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="monRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1f0904"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e04"/>
      <stop offset="50%" stop-color="#2e1605"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>

    <radialGradient id="amberShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dynamic Ground Shadow -->
  <ellipse cx="80" cy="154" rx="46" ry="10" fill="url(#amberShadow)">
    <animate attributeName="rx" values="42;48;42" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 3D Floating Terminal Rig -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3s" repeatCount="indefinite"/>

    <!-- 3D Isometric Platform -->
    <polygon points="80,120 132,142 80,164 28,142" fill="url(#platTop4)"/>
    <polygon points="28,142 80,164 80,169 28,147" fill="url(#platLeft4)"/>
    <polygon points="80,164 132,142 132,147 80,169" fill="url(#platRight4)"/>
    <polyline points="28,142 80,164 132,142" fill="none" stroke="#fde68a" stroke-width="1.2" opacity="0.9"/>

    <!-- 3D Pedestal Stand -->
    <polygon points="76,112 84,116 84,124 76,120" fill="#78350f"/>
    <polygon points="84,116 92,112 92,120 84,124" fill="#451a03"/>

    <!-- 3D Isometric Monitor Housing -->
    <!-- Top Face -->
    <polygon points="80,44 122,60 80,74 38,60" fill="url(#monTop)"/>
    <!-- Left Face (Screen Bezel) -->
    <polygon points="38,60 80,74 80,118 38,104" fill="url(#monLeft)"/>
    <!-- Right Face (Housing Depth) -->
    <polygon points="80,74 122,60 122,104 80,118" fill="url(#monRight)"/>

    <!-- Bevel Specular Highlights -->
    <line x1="80" y1="74" x2="80" y2="118" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="38" y1="60" x2="80" y2="74" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <line x1="80" y1="74" x2="122" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <!-- 3D Screen Surface (Inset on Left Face) -->
    <polygon points="42,66 76,77 76,112 42,100" fill="url(#screenGlass)"/>

    <!-- Telemetry Holographic Bar Graphs on Screen -->
    <g filter="url(#glowAmber)">
      <!-- Bar 1 (Green) -->
      <polygon points="46,94 51,96 51,99 46,97" fill="#10b981">
        <animate attributeName="points" values="46,94 51,96 51,99 46,97; 46,88 51,90 51,99 46,97; 46,94 51,96 51,99 46,97" dur="1.8s" repeatCount="indefinite"/>
      </polygon>
      <!-- Bar 2 (Gold) -->
      <polygon points="53,92 58,94 58,99 53,97" fill="#fbbf24">
        <animate attributeName="points" values="53,92 58,94 58,99 53,97; 53,82 58,84 58,99 53,97; 53,92 58,94 58,99 53,97" dur="1.4s" repeatCount="indefinite"/>
      </polygon>
      <!-- Bar 3 (Orange) -->
      <polygon points="60,86 65,88 65,99 60,97" fill="#f97316">
        <animate attributeName="points" values="60,86 65,88 65,99 60,97; 60,76 65,78 65,99 60,97; 60,86 65,88 65,99 60,97" dur="2s" repeatCount="indefinite"/>
      </polygon>
      <!-- Bar 4 (Cyan) -->
      <polygon points="67,84 72,86 72,99 67,97" fill="#00f0ff">
        <animate attributeName="points" values="67,84 72,86 72,99 67,97; 67,72 72,74 72,99 67,97; 67,84 72,86 72,99 67,97" dur="1.6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Terminal Monospace Text on Screen -->
    <text x="45" y="74" fill="#fbbf24" font-family="'JetBrains Mono', Consolas, monospace" font-size="5" font-weight="700">&gt; 200 OK</text>
    <text x="45" y="80" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="4.2" opacity="0.8">12ms · logs</text>

    <!-- Blinking Cursor -->
    <polygon points="68,71 71,72 71,75 68,74" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </polygon>

    <!-- 3D Floating Observability Badge overhead -->
    <g transform="translate(94, 28) rotate(-4)">
      <polygon points="0,0 42,-6 50,14 8,20" fill="url(#platTop4)" opacity="0.95" stroke="#ffffff" stroke-width="0.8"/>
      <text x="24" y="6" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="900" text-anchor="middle">METRICS</text>
      <text x="24" y="14" fill="#fef08a" font-family="'JetBrains Mono', Consolas, monospace" font-size="6" font-weight="800" text-anchor="middle">99.99%</text>
    </g>

    <!-- Radiating Signal Waves (Upper Right) -->
    <path d="M 124 50 Q 134 44 140 34" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0 25; 25 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 128 54 Q 140 46 146 36" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0 25; 25 0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- Floating Sparkles -->
    <polygon points="34,80 37,83 34,86 31,83" fill="#fde68a">
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,-6; 0,0" dur="2.2s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>