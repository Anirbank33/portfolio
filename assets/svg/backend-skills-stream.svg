        <rect x="0" y="0" width="190" height="32" rx="16" fill="#240b36" stroke="#c084fc" stroke-width="1.3"/>
        <text x="95" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🧩 DSA &amp; Problem Solving</text>
      </g>
      <g transform="translate(3088, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="#04222b" stroke="#06b6d4" stroke-width="1.3"/>
        <text x="80" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🐳 Docker Containers</text>
      </g>
      <g transform="translate(3262, 0)">
        <rect x="0" y="0" width="175" height="32" rx="16" fill="#2d0a14" stroke="#f43f5e" stroke-width="1.3"/>
        <text x="87" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🛠️ Git &amp; Branching Flow</text>
      </g>
