        <text x="77" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🐧 Linux CLI &amp; Bash</text>
      </g>
    </g>

    <!-- Gradient Edge Fade Masks (Left & Right) -->
    <rect x="12" y="38" width="45" height="42" fill="url(#fadeLeft)" pointer-events="none"/>
    <rect x="823" y="38" width="45" height="42" fill="url(#fadeRight)" pointer-events="none"/>
  </g>
