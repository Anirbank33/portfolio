      </g>
      <g transform="translate(2695, 0)">
        <rect x="0" y="0" width="175" height="32" rx="16" fill="#2d1205" stroke="#f97316" stroke-width="1.3"/>
        <text x="87" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">📮 Postman &amp; API Tests</text>
      </g>
