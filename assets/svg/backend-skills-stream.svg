<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg [
  <!ENTITY nbsp "&#160;">
]>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 88" width="100%" height="88" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Glowing Spectrum Border -->
    <linearGradient id="spectrumBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Edge Fade Mask Gradients -->
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="1"/>
    </linearGradient>

    <!-- Clip Path for Moving Pill Stream -->
    <clipPath id="marqueeClip">
      <rect x="12" y="38" width="856" height="42" rx="6"/>
    </clipPath>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="878" height="86" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Accent Laser Line -->
  <line x1="12" y1="1.5" x2="868" y2="1.5" stroke="url(#spectrumBorder)" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= TOP STATUS BAR ================= -->
  <!-- Pulsing Green Dot -->
  <circle cx="26" cy="20.5" r="4.5" fill="#10b981" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5;3.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Header Text (Enlarged) -->
  <text x="38" y="25" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
    🌱 BACKEND DEVELOPER <tspan fill="#475569">|</tspan> <tspan fill="#00f0ff">LEARNING &amp; BUILDING</tspan>
  </text>

  <!-- Right Stage Progress Badge -->
  <g transform="translate(664, 10)">
    <rect x="0" y="0" width="192" height="21" rx="10.5" fill="#1e293b" stroke="#334155" stroke-width="0.9"/>
    <circle cx="12" cy="10.5" r="3.5" fill="#ec4899" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14.5" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">
      STAGE: <tspan fill="#fbbf24">CORE</tspan> ➜ <tspan fill="#38bdf8">ARCHITECTURE</tspan>
    </text>
  </g>

  <!-- Divider Line Between Header & Moving Stream -->
  <line x1="20" y1="34" x2="860" y2="34" stroke="#1e293b" stroke-width="1"/>

  <!-- ================= MOVING SKILL TRACK ================= -->
  <g clip-path="url(#marqueeClip)">
    <g transform="translate(0, 42)">
      <!-- Smooth Infinite Moving Marquee via SMIL translate -->
      <animateTransform attributeName="transform" type="translate" from="0 42" to="-1810 42" dur="20s" repeatCount="indefinite"/>

      <!-- ====== SET 1: 10 SKILL PILLS (Width: 1810px, Font-size: 11px Unchanged) ====== -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="32" rx="16" fill="#032030" stroke="#00f0ff" stroke-width="1.3"/>
        <text x="77" y="20" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">☕ Core Java &amp; OOP</text>
      </g>
      <g transform="translate(169, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="#03261c" stroke="#10b981" stroke-width="1.3"/>
