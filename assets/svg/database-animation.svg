<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
  <defs>
    <!-- 3D Platform Gradients -->
    <linearGradient id="platTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="platLeft3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="platRight3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#011611"/>
    </linearGradient>

    <!-- 3D Database Cylinder Gradients -->
    <linearGradient id="diskTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="diskBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="diskGlowCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f59b"/>
    </linearGradient>

    <radialGradient id="emeraldShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dynamic Ground Shadow -->
  <ellipse cx="80" cy="154" rx="46" ry="10" fill="url(#emeraldShadow)">
    <animate attributeName="rx" values="42;48;42" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 3D Floating Database Assembly -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.8s" repeatCount="indefinite"/>

    <!-- 3D Isometric Platform -->
    <polygon points="80,120 132,142 80,164 28,142" fill="url(#platTop3)"/>
    <polygon points="28,142 80,164 80,169 28,147" fill="url(#platLeft3)"/>
    <polygon points="80,164 132,142 132,147 80,169" fill="url(#platRight3)"/>
    <polyline points="28,142 80,164 132,142" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.9"/>

    <!-- 3D Triple-Tier Database Stack -->

    <!-- TIER 3 (BOTTOM) -->
    <g transform="translate(0, 32)">
      <rect x="52" y="80" width="56" height="16" fill="url(#diskBody)"/>
      <ellipse cx="80" cy="96" rx="28" ry="9" fill="#047857"/>
      <ellipse cx="80" cy="80" rx="28" ry="9" fill="url(#diskTop)"/>
      <!-- Glowing activity line -->
      <path d="M 54 88 Q 80 97 106 88" fill="none" stroke="#00f59b" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Glowing Core Pulse between Tier 3 and Tier 2 -->
    <ellipse cx="80" cy="96" rx="24" ry="7" fill="url(#diskGlowCore)" opacity="0.85" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- TIER 2 (MIDDLE) -->
    <g transform="translate(0, 14)">
      <rect x="52" y="70" width="56" height="16" fill="url(#diskBody)"/>
      <ellipse cx="80" cy="86" rx="28" ry="9" fill="#047857"/>
      <ellipse cx="80" cy="70" rx="28" ry="9" fill="url(#diskTop)"/>
      <!-- Glowing activity line -->
      <path d="M 54 78 Q 80 87 106 78" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Glowing Core Pulse between Tier 2 and Tier 1 -->
    <ellipse cx="80" cy="70" rx="24" ry="7" fill="url(#diskGlowCore)" opacity="0.85" filter="url(#glowGreen)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- TIER 1 (TOP) -->
    <g transform="translate(0, -4)">
      <rect x="52" y="60" width="56" height="16" fill="url(#diskBody)"/>
      <ellipse cx="80" cy="76" rx="28" ry="9" fill="#047857"/>
      <ellipse cx="80" cy="60" rx="28" ry="9" fill="url(#diskTop)"/>
      <!-- Inset Top Spindle -->
      <ellipse cx="80" cy="60" rx="16" ry="5" fill="#065f46"/>
      <ellipse cx="80" cy="59" rx="8" ry="3" fill="#6ee7b7" filter="url(#glowGreen)"/>
      <!-- Top Label -->
      <text x="80" y="52" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="7" font-weight="900" text-anchor="middle">DATA</text>
    </g>

    <!-- 3D Orbiting Flux Rings around the Database Cluster -->
    <ellipse cx="80" cy="88" rx="46" ry="16" fill="none" stroke="#00f59b" stroke-width="1.4" stroke-dasharray="8 6" filter="url(#glowGreen)">
      <animateTransform attributeName="transform" type="rotate" from="0 80 88" to="360 80 88" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="80" cy="88" rx="40" ry="12" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="360 80 88" to="0 80 88" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Ascending Holographic Binary / Particle Packets -->
    <circle cx="50" cy="56" r="2.5" fill="#00f59b">
      <animate attributeName="cy" values="56;32;56" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="64" r="2.2" fill="#34d399">
      <animate attributeName="cy" values="64;40;64" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>

  </g>
</svg>