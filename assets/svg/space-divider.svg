<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 80" width="100%" height="80" preserveAspectRatio="none" fill="none">
  <defs>
    <!-- Cosmic Wave Linear Gradient -->
    <linearGradient id="cosmicWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Starlight Beam -->
    <linearGradient id="starlightLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveGlide {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes starPulseSlow {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .wave-path {
      animation: waveGlide 10s ease-in-out infinite;
    }
    .pulse-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: starPulseSlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Ambient Cosmic Haze Path -->
  <path class="wave-path" d="M 0,40 C 320,10 480,70 720,40 C 960,10 1120,65 1440,35 L 1440,80 L 0,80 Z" fill="url(#cosmicWaveGrad)"/>

  <!-- Core Starlight Ribbon Line -->
  <path d="M 0,40 C 360,70 720,10 1080,60 C 1260,35 1380,45 1440,40" stroke="url(#starlightLine)" stroke-width="2" fill="none" filter="url(#divGlow)"/>

  <!-- Constellation Nodes & Micro Stars along the Transition -->
  <circle class="pulse-star" cx="240" cy="30" r="3" fill="#38bdf8" filter="url(#divGlow)"/>
  <circle class="pulse-star" cx="540" cy="52" r="3.5" fill="#c084fc" filter="url(#divGlow)" style="animation-delay: -1s;"/>
  <circle class="pulse-star" cx="890" cy="22" r="4" fill="#ffffff" filter="url(#divGlow)" style="animation-delay: -2s;"/>
  <circle class="pulse-star" cx="1220" cy="50" r="3" fill="#f43f5e" filter="url(#divGlow)" style="animation-delay: -1.5s;"/>

  <!-- Thin Constellation Link Lines -->
  <line x1="240" y1="30" x2="380" y2="45" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="720" y1="35" x2="890" y2="22" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="890" y1="22" x2="1050" y2="40" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
</svg>
