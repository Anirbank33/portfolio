<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
  <defs>
    <!-- 3D Platform Gradients -->
    <linearGradient id="platTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="platLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="platRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e0533"/>
    </linearGradient>

    <!-- 3D Server Gradients -->
    <linearGradient id="srvTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="srvLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="srvRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="50%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#2e0854"/>
    </linearGradient>

    <!-- Glowing Gateway Core -->
    <linearGradient id="coreHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="magShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowMagenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dynamic Ground Shadow -->
  <ellipse cx="80" cy="154" rx="46" ry="10" fill="url(#magShadow)">
    <animate attributeName="rx" values="42;48;42" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 3D Floating Server Rig -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3.2s" repeatCount="indefinite"/>

    <!-- 3D Isometric Platform -->
    <polygon points="80,120 132,142 80,164 28,142" fill="url(#platTop2)"/>
    <polygon points="28,142 80,164 80,169 28,147" fill="url(#platLeft2)"/>
    <polygon points="80,164 132,142 132,147 80,169" fill="url(#platRight2)"/>
    <polyline points="28,142 80,164 132,142" fill="none" stroke="#f0abfc" stroke-width="1.2" opacity="0.9"/>

    <!-- 3D Server Monolith Tower -->
    <!-- Top Face -->
    <polygon points="80,50 114,64 80,78 46,64" fill="url(#srvTop)"/>
    <!-- Left Front Face -->
    <polygon points="46,64 80,78 80,132 46,118" fill="url(#srvLeft)"/>
    <!-- Right Front Face -->
    <polygon points="80,78 114,64 114,118 80,132" fill="url(#srvRight)"/>

    <!-- Isometric Edge Bevel Lines -->
    <line x1="80" y1="78" x2="80" y2="132" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
    <line x1="46" y1="64" x2="80" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="80" y1="78" x2="114" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

    <!-- Server Blade Slots (Left Face) -->
    <g transform="translate(0, 0)">
      <!-- Blade 1 -->
      <polygon points="50,74 76,85 76,93 50,82" fill="#1e1b4b" opacity="0.85"/>
      <line x1="53" y1="78" x2="73" y2="86" stroke="#ff007f" stroke-width="1.2"/>
      <!-- Blade 2 -->
      <polygon points="50,88 76,99 76,107 50,96" fill="#1e1b4b" opacity="0.85"/>
      <line x1="53" y1="92" x2="73" y2="100" stroke="#f43f5e" stroke-width="1.2"/>
      <!-- Blade 3 -->
      <polygon points="50,102 76,113 76,121 50,110" fill="#1e1b4b" opacity="0.85"/>
      <line x1="53" y1="106" x2="73" y2="114" stroke="#a855f7" stroke-width="1.2"/>
    </g>

    <!-- Blinking Server Activity LED Array (Left Face) -->
    <circle cx="55" cy="80" r="1.8" fill="#00f0ff" filter="url(#glowMagenta)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="82.5" r="1.8" fill="#ff007f" filter="url(#glowMagenta)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="94" r="1.8" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="96.5" r="1.8" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="108" r="1.8" fill="#f43f5e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="110.5" r="1.8" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Cooling Vents (Right Face) -->
    <line x1="86" y1="84" x2="108" y2="75" stroke="#ec4899" stroke-width="1.2" opacity="0.55"/>
    <line x1="86" y1="91" x2="108" y2="82" stroke="#ec4899" stroke-width="1.2" opacity="0.55"/>
    <line x1="86" y1="98" x2="108" y2="89" stroke="#ec4899" stroke-width="1.2" opacity="0.55"/>
    <line x1="86" y1="105" x2="108" y2="96" stroke="#ec4899" stroke-width="1.2" opacity="0.55"/>
    <line x1="86" y1="112" x2="108" y2="103" stroke="#ec4899" stroke-width="1.2" opacity="0.55"/>

    <!-- 3D Floating Holographic Gateway Core (Rotating Diamond) -->
    <g transform="translate(80, 32)">
      <polygon points="0,-16 14,-6 0,4 -14,-6" fill="url(#coreHolo)" filter="url(#glowMagenta)"/>
      <polygon points="-14,-6 0,4 0,16 -14,6" fill="#a855f7"/>
      <polygon points="0,4 14,-6 14,6 0,16" fill="#701a75"/>
      <text x="0" y="2" fill="#ffffff" font-family="'JetBrains Mono', Consolas, monospace" font-size="6.5" font-weight="900" text-anchor="middle">API</text>
    </g>

    <!-- Orbiting Energy Ring around Gateway Core -->
    <ellipse cx="80" cy="32" rx="26" ry="8" fill="none" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 80 32" to="360 80 32" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Outgoing Data Pulse -->
    <circle cx="124" cy="106" r="3.2" fill="#f43f5e" filter="url(#glowMagenta)">
      <animate attributeName="cx" values="108;148;108" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>