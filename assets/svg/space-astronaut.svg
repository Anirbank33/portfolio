<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Space Visor Gradient -->
    <linearGradient id="astroVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Visor Specular Glint -->
    <linearGradient id="astroGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Suit Shading Gradient -->
    <linearGradient id="suitGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Suit Dark Joints -->
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Thruster Flame Gradient -->
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="astroGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="thrusterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes astroBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }
    @keyframes astroVisorReflect {
      0%, 100% { opacity: 0.85; filter: hue-rotate(0deg); }
      50% { opacity: 1; filter: hue-rotate(45deg); }
    }
    @keyframes jetpackPulse {
      0%, 100% { transform: scaleY(1); opacity: 0.85; }
      50% { transform: scaleY(1.35) scaleX(1.1); opacity: 1; }
    }
    @keyframes tetherDrift {
      0%, 100% { d: path("M 60 170 Q 20 210, 45 250 T 10 260"); }
      50% { d: path("M 60 170 Q 30 190, 20 235 T 25 260"); }
    }
    .astro-main-group {
      animation: astroBob 6s ease-in-out infinite;
      transform-origin: center center;
    }
    .astro-visor-elem {
      animation: astroVisorReflect 5s ease-in-out infinite;
    }
    .jet-flame {
      transform-origin: top center;
      animation: jetpackPulse 0.8s ease-in-out infinite alternate;
    }
  </style>

  <!-- Micro-gravity Oxygen Tether -->
  <path class="astro-tether" d="M 60 170 Q 20 210, 45 250 T 10 260" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6" fill="none" style="animation: tetherDrift 7s ease-in-out infinite;"/>

  <g class="astro-main-group">
    <!-- Life Support Backpack (PLSS) -->
    <rect x="42" y="75" width="46" height="70" rx="10" fill="url(#jointGrad)" stroke="#64748b" stroke-width="2"/>
    <rect x="48" y="82" width="14" height="20" rx="4" fill="#0284c7" opacity="0.7"/>
    <rect x="66" y="82" width="14" height="20" rx="4" fill="#a855f7" opacity="0.7"/>

    <!-- Jetpack Thruster Nozzles & Exhaust Plumes -->
    <rect x="46" y="145" width="12" height="8" rx="2" fill="#475569"/>
    <rect x="68" y="145" width="12" height="8" rx="2" fill="#475569"/>

    <ellipse class="jet-flame" cx="52" cy="162" rx="5" ry="14" fill="url(#thrusterGrad)" filter="url(#thrusterGlow)"/>
    <ellipse class="jet-flame" cx="74" cy="162" rx="5" ry="14" fill="url(#thrusterGrad)" filter="url(#thrusterGlow)" style="animation-delay: -0.4s;"/>

    <!-- Right Leg -->
    <g transform="rotate(12 125 155)">
      <!-- Thigh -->
      <rect x="118" y="152" width="22" height="34" rx="8" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="129" cy="186" r="8" fill="url(#jointGrad)"/>
      <!-- Shin -->
      <rect x="120" y="188" width="18" height="30" rx="6" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Boot -->
      <path d="M 118 214 L 144 214 A 6 6 0 0 1 150 220 L 150 226 L 114 226 A 4 4 0 0 1 118 214 Z" fill="url(#jointGrad)" stroke="#00f0ff" stroke-width="1.2"/>
      <rect x="120" y="222" width="28" height="3" rx="1.5" fill="#00f0ff" opacity="0.8"/>
    </g>

    <!-- Left Leg -->
    <g transform="rotate(-8 95 155)">
      <!-- Thigh -->
      <rect x="82" y="152" width="22" height="34" rx="8" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="93" cy="186" r="8" fill="url(#jointGrad)"/>
      <!-- Shin -->
      <rect x="84" y="188" width="18" height="30" rx="6" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Boot -->
      <path d="M 82 214 L 108 214 A 6 6 0 0 1 114 220 L 114 226 L 78 226 A 4 4 0 0 1 82 214 Z" fill="url(#jointGrad)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="84" y="222" width="28" height="3" rx="1.5" fill="#38bdf8" opacity="0.8"/>
    </g>

    <!-- Main Torso Suit -->
    <rect x="74" y="80" width="62" height="78" rx="18" fill="url(#suitGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Chest Control Computer -->
    <rect x="86" y="94" width="38" height="28" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="94" cy="103" r="3.5" fill="#00f0ff" filter="url(#astroGlow)"/>
    <circle cx="105" cy="103" r="3.5" fill="#34d399" filter="url(#astroGlow)"/>
    <circle cx="116" cy="103" r="3.5" fill="#f43f5e" filter="url(#astroGlow)"/>
    <line x1="92" y1="114" x2="118" y2="114" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Arm -->
    <g transform="rotate(28 72 90)">
      <rect x="52" y="88" width="18" height="30" rx="7" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="61" cy="118" r="7" fill="url(#jointGrad)"/>
      <rect x="53" y="120" width="16" height="26" rx="6" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Glove -->
      <circle cx="61" cy="150" r="9" fill="url(#jointGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    </g>

    <!-- Right Arm (Raised / Greeting Wave) -->
    <g transform="rotate(-38 138 90)">
      <rect x="140" y="88" width="18" height="30" rx="7" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="149" cy="118" r="7" fill="url(#jointGrad)"/>
      <rect x="141" y="120" width="16" height="26" rx="6" fill="url(#suitGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Glove -->
      <circle cx="149" cy="150" r="9" fill="url(#jointGrad)" stroke="#f43f5e" stroke-width="1.2"/>
    </g>

    <!-- Helmet Collar Ring -->
    <ellipse cx="105" cy="80" rx="28" ry="10" fill="url(#jointGrad)" stroke="#64748b" stroke-width="2"/>

    <!-- Space Helmet Base Dome -->
    <circle cx="105" cy="56" r="32" fill="url(#suitGrad)" stroke="#e2e8f0" stroke-width="2.5"/>

    <!-- Cosmic Visor Bubble with Nebula Reflection -->
    <rect class="astro-visor-elem" x="84" y="38" width="42" height="32" rx="14" fill="url(#astroVisor)" stroke="#ffffff" stroke-width="1.2" filter="url(#astroGlow)"/>

    <!-- Visor High-Arc Glint / Specular Light -->
    <ellipse cx="98" cy="46" rx="12" ry="5" transform="rotate(-15 98 46)" fill="url(#astroGlint)"/>
    <circle cx="118" cy="45" r="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- Radio Comms Antenna with Pulsing Beacon -->
    <line x1="130" y1="42" x2="142" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="143" cy="21" r="3.5" fill="#f43f5e" filter="url(#astroGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
