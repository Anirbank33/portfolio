<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150">
  <defs>
    <linearGradient id="dbBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d419d"/>
      <stop offset="35%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="65%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d419d"/>
    </linearGradient>
    <linearGradient id="dbLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="dbGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="70" cy="132" rx="36" ry="7" fill="#58a6ff" opacity="0.16">
    <animate attributeName="rx" values="32;38;32" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>
  <g filter="url(#dbGlow)">
    <rect x="38" y="52" width="64" height="58" fill="url(#dbBody)" rx="2"/>
    <ellipse cx="70" cy="110" rx="32" ry="10" fill="#0d419d"/>
    <ellipse cx="70" cy="52" rx="32" ry="12" fill="url(#dbLid)"/>
    <ellipse cx="70" cy="74" rx="32" ry="10" fill="none" stroke="#79c0ff" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="70" cy="92" rx="32" ry="10" fill="none" stroke="#79c0ff" stroke-width="1.5" opacity="0.35"/>
  </g>
  <ellipse cx="70" cy="52" rx="18" ry="5" fill="#a5d6ff" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;20;14" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="70" cy="52" r="4" fill="#ffffff" opacity="0.85">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.9">
    <circle cx="70" cy="52" r="2" fill="#58a6ff">
      <animate attributeName="cy" values="52;28;52" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
