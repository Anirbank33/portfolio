<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 2026 Surge Bar Gradient -->
    <linearGradient id="surgeBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Historical Bars Gradient -->
    <linearGradient id="histBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="previewGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="248" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Subtle Top Accent Line -->
  <line x1="12" y1="1" x2="868" y2="1" stroke="#00f0ff" stroke-width="2" opacity="0.85"/>

  <!-- ================= HEADER ================= -->
  <!-- Live Status Pulse -->
  <circle cx="34" cy="32" r="5" fill="#10b981" filter="url(#previewGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="36" fill="#f0f6fc" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" letter-spacing="0.5">
    GITHUB ACTIVITY DASHBOARD (2021–2026)
  </text>
  <text x="500" y="36" fill="#8b949e" font-family="'Inter', sans-serif" font-size="12" opacity="0.9">
    • Multi-Year Contribution Velocity &amp; Analytics
  </text>

  <!-- Live Link CTA Button (Right) -->
  <g transform="translate(730, 20)">
    <rect x="0" y="0" width="124" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1"/>
    <text x="62" y="16" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">
      VIEW LIVE ➜
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="52" x2="856" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- ================= LEFT: 4 STAT CARDS ================= -->
  <!-- Card 1: Total Contributions -->
  <g transform="translate(24, 66)">
    <rect width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="36" fill="#00f0ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="800">411</text>
    <text x="16" y="58" fill="#8b949e" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Total Contributions</text>
    <circle cx="160" cy="24" r="4" fill="#00f0ff" opacity="0.8"/>
  </g>

  <!-- Card 2: Active Days -->
  <g transform="translate(216, 66)">
    <rect width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="36" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="800">202</text>
    <text x="16" y="58" fill="#8b949e" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Active Days Logged</text>
    <circle cx="160" cy="24" r="4" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Card 3: 2026 Surge Volume -->
  <g transform="translate(24, 152)">
    <rect width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="36" fill="#fbbf24" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="800">321</text>
    <text x="16" y="58" fill="#8b949e" font-family="'Inter', sans-serif" font-size="11" font-weight="500">2026 Contributions</text>
    <circle cx="160" cy="24" r="4" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Card 4: Growth Velocity Share -->
  <g transform="translate(216, 152)">
    <rect width="180" height="74" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="36" fill="#ec4899" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="800">78%</text>
    <text x="16" y="58" fill="#8b949e" font-family="'Inter', sans-serif" font-size="11" font-weight="500">2026 Volume Surge 🚀</text>
    <circle cx="160" cy="24" r="4" fill="#ec4899" opacity="0.8"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="416" y1="66" x2="416" y2="226" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= RIGHT: YEARLY BAR CHART ================= -->
  <!-- Chart Baseline -->
  <line x1="440" y1="202" x2="850" y2="202" stroke="#30363d" stroke-width="1"/>

  <!-- 2021 Bar -->
  <g transform="translate(455, 0)">
    <rect x="0" y="184" width="34" height="18" rx="4" fill="url(#histBar)" opacity="0.6"/>
    <text x="17" y="176" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">12</text>
    <text x="17" y="218" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">2021</text>
  </g>

  <!-- 2022 Bar -->
  <g transform="translate(520, 0)">
    <rect x="0" y="174" width="34" height="28" rx="4" fill="url(#histBar)" opacity="0.7"/>
    <text x="17" y="166" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">24</text>
    <text x="17" y="218" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">2022</text>
  </g>

  <!-- 2023 Bar -->
  <g transform="translate(585, 0)">
    <rect x="0" y="179" width="34" height="23" rx="4" fill="url(#histBar)" opacity="0.65"/>
    <text x="17" y="171" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">18</text>
    <text x="17" y="218" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">2023</text>
  </g>

  <!-- 2024 Bar -->
  <g transform="translate(650, 0)">
    <rect x="0" y="182" width="34" height="20" rx="4" fill="url(#histBar)" opacity="0.65"/>
    <text x="17" y="174" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">15</text>
    <text x="17" y="218" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">2024</text>
  </g>

  <!-- 2025 Bar -->
  <g transform="translate(715, 0)">
    <rect x="0" y="176" width="34" height="26" rx="4" fill="url(#histBar)" opacity="0.75"/>
    <text x="17" y="168" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">21</text>
    <text x="17" y="218" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">2025</text>
  </g>

  <!-- 2026 SURGE BAR (GIANT 321 CONTRIBUTIONS) -->
  <g transform="translate(780, 0)">
    <!-- Animated Beaming Glow behind 2026 -->
    <rect x="-4" y="66" width="58" height="136" rx="8" fill="#ec4899" opacity="0.15" filter="url(#previewGlow)">
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- Main Bar -->
    <rect x="0" y="70" width="50" height="132" rx="6" fill="url(#surgeBar)"/>

    <!-- Peak Value Label with Pulse -->
    <text x="25" y="60" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle" filter="url(#previewGlow)">
      321 🔥
    </text>
    <text x="25" y="218" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" text-anchor="middle">
      2026
    </text>

    <!-- Floating Top Energy Wave -->
    <line x1="4" y1="72" x2="46" y2="72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
