<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150">
  <defs>
    <linearGradient id="termBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="termBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484f58"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="70" cy="134" rx="40" ry="6" fill="#58a6ff" opacity="0.14">
    <animate attributeName="rx" values="36;42;36" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <g filter="url(#termGlow)">
    <rect x="22" y="34" width="96" height="72" rx="8" fill="url(#termBezel)"/>
    <rect x="28" y="40" width="84" height="52" rx="4" fill="url(#screen)"/>
    <rect x="50" y="106" width="40" height="6" rx="2" fill="#30363d"/>
    <rect x="40" y="112" width="60" height="4" rx="2" fill="#21262d"/>
  </g>
  <text x="34" y="56" fill="#3fb950" font-family="Consolas, Menlo, monospace" font-size="9">$ build</text>
  <text x="34" y="70" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="8" opacity="0">
    compiling&
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="34" y="84" fill="#58a6ff" font-family="Consolas, Menlo, monospace" font-size="8" opacity="0">
     ready
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.55;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <rect x="78" y="48" width="5" height="9" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <path d="M28 40 H112" stroke="#58a6ff" stroke-width="1" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.45;0.1" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
