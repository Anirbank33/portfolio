<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bkCmpBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Liquid Glass Edge Bevel -->
    <linearGradient id="bkCmpBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#71717a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="bkCmpSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bkCmpShimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;220%" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;320%" dur="7.4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="bkCmpOrb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="bkCmpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Liquid Caustics -->
  <circle cx="45" cy="50" r="40" fill="#ffffff" opacity="0.22" filter="url(#bkCmpOrb)">
    <animate attributeName="cx" values="45;70;45" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="190" r="45" fill="#ffffff" opacity="0.18" filter="url(#bkCmpOrb)">
    <animate attributeName="cy" values="190;160;190" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer Glass Panel -->
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpBgDark)" stroke="url(#bkCmpBorderDark)" stroke-width="1.4"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpSheen)"/>
  <rect x="2" y="2" width="166" height="276" rx="14" fill="url(#bkCmpShimmer)"/>
  <line x1="14" y1="2" x2="156" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.9" filter="url(#bkCmpGlow)"/>

  <!-- Category Tag -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="150" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="3" fill="#ffffff" filter="url(#bkCmpGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="12.5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.5">
      SYSTEM ARCHITECTURE
    </text>
  </g>

  <!-- Title -->
  <text x="10" y="48" fill="#ffffff" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.2">
    backend-demo
  </text>
  <text x="10" y="62" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
    Document REST API
  </text>

  <!-- Tagline -->
  <text x="10" y="78" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500">
    Modular router &amp; client
  </text>

  <!-- ANIMATED MICROSERVICE PIPELINE HUD -->
  <g transform="translate(10, 88)">
    <rect x="0" y="0" width="150" height="78" rx="8" fill="#000000" fill-opacity="0.9" stroke="#3f3f46" stroke-width="0.8"/>

    <line x1="0" y1="18" x2="150" y2="18" stroke="#27272a" stroke-width="0.8"/>
    <text x="10" y="12" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      SERVICE ROUTER
    </text>
    <text x="142" y="12" text-anchor="end" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">
      200 OK
    </text>

    <!-- Channels -->
    <line x1="38" y1="46" x2="62" y2="46" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="90" y1="46" x2="114" y2="46" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Node 1: CLIENT -->
    <g transform="translate(6, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="16" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">CLI</text>
    </g>

    <!-- Node 2: EXPRESS -->
    <g transform="translate(60, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
      <text x="16" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">API</text>
    </g>

    <!-- Node 3: STORAGE -->
    <g transform="translate(112, 34)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="16" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">DB</text>
    </g>

    <!-- Moving Liquid Glass Packets -->
    <circle cx="40" cy="46" r="2.5" fill="#ffffff" filter="url(#bkCmpGlow)">
      <animate attributeName="cx" values="40;60;40" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="46" r="2.5" fill="#ffffff" filter="url(#bkCmpGlow)">
      <animate attributeName="cx" values="92;112;92" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Flow status -->
    <text x="75" y="70" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">
      GET /api/v1 • SECURE
    </text>
  </g>

  <!-- TECH BADGES (Frosted Glass) -->
  <g transform="translate(10, 178)">
    <rect x="0" y="0" width="54" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="27" y="12.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Node.js</text>

    <rect x="60" y="0" width="46" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="83" y="12.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Express</text>

    <rect x="112" y="0" width="38" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="131" y="12.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">REST</text>

    <rect x="0" y="24" width="50" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="25" y="36.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">JWT Auth</text>

    <rect x="56" y="24" width="52" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="82" y="36.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">Modular</text>

    <rect x="114" y="24" width="36" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="132" y="36.5" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">CRUD</text>
  </g>

  <!-- Bottom CTA Pill -->
  <g transform="translate(10, 248)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.2"/>
    <text x="75" y="15" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.4">
      ⚡ INSPECT ENGINE ↗
    </text>
  </g>
</svg>