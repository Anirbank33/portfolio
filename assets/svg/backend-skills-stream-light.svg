    <!-- Gradient Edge Fade Masks (Left & Right) -->
    <rect x="12" y="38" width="45" height="42" fill="url(#fadeLeftLight)" pointer-events="none"/>
    <rect x="823" y="38" width="45" height="42" fill="url(#fadeRightLight)" pointer-events="none"/>
  </g>
