        <rect x="0" y="0" width="160" height="32" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.3"/>
        <text x="80" y="20" fill="#0e7490" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🐳 Docker Containers</text>
      </g>
