<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg [
  <!ENTITY nbsp "&#160;">
]>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 88" width="100%" height="88" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient (Light Mode) -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Glowing Spectrum Border -->
    <linearGradient id="spectrumBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Edge Fade Mask Gradients (Light) -->
    <linearGradient id="fadeLeftLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRightLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Clip Path for Moving Pill Stream -->
    <clipPath id="marqueeClipLight">
      <rect x="12" y="38" width="856" height="42" rx="6"/>
    </clipPath>

    <!-- Glow Filter -->
    <filter id="neonGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="878" height="86" rx="10" fill="url(#bgGradLight)" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Top Accent Laser Line -->
  <line x1="12" y1="1.5" x2="868" y2="1.5" stroke="url(#spectrumBorder)" stroke-width="2" stroke-linecap="round"/>

  <!-- ================= TOP STATUS BAR ================= -->
  <!-- Pulsing Green Dot -->
  <circle cx="26" cy="20.5" r="4.5" fill="#16a34a" filter="url(#neonGlowLight)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5;3.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Header Text (Enlarged) -->
  <text x="38" y="25" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="800" letter-spacing="0.4">
    🌱 BACKEND DEVELOPER <tspan fill="#94a3b8">|</tspan> <tspan fill="#0284c7">LEARNING &amp; BUILDING</tspan>
  </text>

  <!-- Right Stage Progress Badge -->
  <g transform="translate(664, 10)">
    <rect x="0" y="0" width="192" height="21" rx="10.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.9"/>
    <circle cx="12" cy="10.5" r="3.5" fill="#db2777" filter="url(#neonGlowLight)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="14.5" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" font-weight="600">
      STAGE: <tspan fill="#d97706">CORE</tspan> ➜ <tspan fill="#0284c7">ARCHITECTURE</tspan>
    </text>
  </g>

  <!-- Divider Line Between Header & Moving Stream -->
  <line x1="20" y1="34" x2="860" y2="34" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= MOVING SKILL TRACK ================= -->
  <g clip-path="url(#marqueeClipLight)">
    <g transform="translate(0, 42)">
      <!-- Smooth Infinite Moving Marquee via SMIL translate -->
      <animateTransform attributeName="transform" type="translate" from="0 42" to="-1810 42" dur="20s" repeatCount="indefinite"/>

      <!-- ====== SET 1: 10 SKILL PILLS (Width: 1810px) ====== -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="32" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
        <text x="77" y="20" fill="#0369a1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">☕ Core Java &amp; OOP</text>
      </g>
      <g transform="translate(169, 0)">
        <rect x="0" y="0" width="165" height="32" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
