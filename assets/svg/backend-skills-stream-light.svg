        <rect x="0" y="0" width="175" height="32" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
        <text x="87" y="20" fill="#be123c" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🛠️ Git &amp; Branching Flow</text>
      </g>
